version: "3"

vars:
  BINARY_NAME: vek
  BUILD_DIR: bin
  MAIN_PACKAGE: ./cmd/vek

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  test:
    desc: Run all tests
    cmds:
      - go test ./...

  check:
    desc: Run formatting, vet, and tests
    deps:
      - fmt
      - vet
      - test

  fmt:
    desc: Format Go code
    cmds:
      - gofmt -w cmd internal

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  build:
    desc: Build the CLI binary into ./bin
    deps:
      - check
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - go build -o {{.BUILD_DIR}}/{{.BINARY_NAME}} {{.MAIN_PACKAGE}}

  install:
    desc: Install the CLI binary into GOPATH/bin or GOBIN
    deps:
      - check
    cmds:
      - go install {{.MAIN_PACKAGE}}

  run:
    desc: Run the CLI
    cmds:
      - go run {{.MAIN_PACKAGE}} {{.CLI_ARGS}}

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf {{.BUILD_DIR}}
